<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>100 Days</title>
  <meta name="description" content="Eric's 100 Days Challenge tracker – reps, runs and stats.">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="100 Days">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-num">100</span> DAYS</div>
    <div class="topbar-right" id="topbarRight"></div>
  </header>

  <main id="app">
    <section id="view-workout" class="view active" aria-label="Workout"></section>
    <section id="view-stats" class="view" aria-label="Stats"></section>
    <section id="view-settings" class="view" aria-label="Settings"></section>
  </main>

  <nav class="tabbar" role="tablist">
    <button class="tab active" data-tab="workout" role="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h2v4H3zM19 10h2v4h-2zM6 7h2v10H6zM16 7h2v10h-2zM8 11h8v2H8z"/></svg>
      <span>Workout</span>
    </button>
    <button class="tab" data-tab="stats" role="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h3v10zM10.5 20V4h3v16zM17 20v-7h3v7z"/></svg>
      <span>Stats</span>
    </button>
    <button class="tab" data-tab="settings" role="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 4.9 1.6 1.2-1.8 3.2-1.9-.7a7 7 0 0 1-1.7 1l-.3 2H11.7l-.3-2a7 7 0 0 1-1.7-1l-1.9.7L6 14.6l1.6-1.2a7 7 0 0 1 0-2L6 10.2 7.8 7l1.9.7a7 7 0 0 1 1.7-1l.3-2h3.6l.3 2a7 7 0 0 1 1.7 1l1.9-.7 1.8 3.2-1.6 1.2a7 7 0 0 1 0 2z"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <dialog id="dlg" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/logic.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/info.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
